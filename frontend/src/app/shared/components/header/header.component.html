<header class="header">
  <div class="header-container container">
    <a routerLink="/products" class="logo" (click)="closeMobileMenu()">
      <span class="logo-icon">S</span>
      <span class="logo-text">ShopHub</span>
    </a>

    <nav class="nav" [class.nav-open]="mobileMenuOpen">
      <a routerLink="/products"
         routerLinkActive="active"
         class="nav-link"
         (click)="closeMobileMenu()">
        Products
      </a>

      <a routerLink="/cart"
         routerLinkActive="active"
         class="nav-link cart-link"
         (click)="closeMobileMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Cart
        <span class="cart-badge" *ngIf="(cartCount$ | async) as count">
          {{ count }}
        </span>
      </a>

      <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
        <a routerLink="/orders"
           routerLinkActive="active"
           class="nav-link"
           (click)="closeMobileMenu()">
          Orders
        </a>
        <div class="user-menu">
          <span class="user-greeting" *ngIf="currentUser$ | async as user">
            Hi, {{ user.firstName }}
          </span>
          <button class="btn btn-secondary btn-sm" (click)="logout()">
            Logout
          </button>
        </div>
      </ng-container>

      <ng-template #loggedOut>
        <a routerLink="/auth/login"
           routerLinkActive="active"
           class="nav-link"
           (click)="closeMobileMenu()">
          Login
        </a>
        <a routerLink="/auth/register"
           class="btn btn-primary btn-sm"
           (click)="closeMobileMenu()">
          Register
        </a>
      </ng-template>
    </nav>

    <button class="hamburger" (click)="toggleMobileMenu()" [class.hamburger-active]="mobileMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
